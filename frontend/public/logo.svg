<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Premium Royal Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Top Sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner Glow Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Glass Sheen Overlay -->
  <rect x="3" y="3" width="58" height="30" rx="15" fill="url(#sheen)"/>

  <!-- Brand Emblem (SchoolHub Dual Sparkle & Academic Crest) -->
  <g filter="url(#softGlow)">
    <!-- Primary Luminous 4-Point Star -->
    <path
      d="M30 13 C30 23.5 24 29.5 13 30 C24 30.5 30 36.5 30 47 C30 36.5 36 30.5 47 30 C36 29.5 30 23.5 30 13 Z"
      fill="#FFFFFF"
    />

    <!-- Secondary Accent Star (Knowledge Spark) -->
    <path
      d="M47 11 C47 15.5 44.5 18 41 18.5 C44.5 19 47 21.5 47 26 C47 21.5 49.5 19 53 18.5 C49.5 18 47 15.5 47 11 Z"
      fill="#93C5FD"
    />

    <!-- Tertiary Micro Sparkle Dot -->
    <circle cx="17" cy="46" r="2.2" fill="#BAE6FD"/>
  </g>
</svg>
